name: Gündem Defteri - 30 Dakika Güncelle ve Yayınla

on:
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gundem-defteri-live
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python hazırla
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Ücretsiz bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Gündem radarı ve doğrulama
        timeout-minutes: 5
        run: python -u RADAR_UPDATE.py

      - name: Boş akışı engelle
        run: |
          python - <<'PY'
          import json, sys
          d=json.load(open('news.json',encoding='utf-8'))
          n=len(d.get('feed',[]))
          print('Yayınlanabilir haber sayısı:', n)
          if n == 0:
              print('Boş akış bulundu; mevcut canlı site korunacak.')
              sys.exit(1)
          PY

      - name: Pages için site klasörünü hazırla
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html article.html design-system.css home.js components.js data.js _site/
          cp -r images _site/images
          touch _site/.nojekyll

      - name: GitHub Pages'i yapılandır
        uses: actions/configure-pages@v5

      - name: Site artifact'ını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
